name: Controlled Copilot repair

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: repair-request-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  verify:
    name: Reproduce current failures without privileged credentials
    if: >-
      github.event.label.name == 'stage:fix' &&
      github.event.sender.login == github.repository_owner &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tested_sha: ${{ steps.current.outputs.tested_sha }}
    steps:
      - name: Check out exact untrusted PR source without write credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Extract approved project repair policy and interpreter from main
        run: |
          git fetch --no-tags origin main
          git show origin/main:.github/repair-policy.json > "$RUNNER_TEMP/repair-policy.json"
          git show origin/main:.github/scripts/repair_core.py > "$RUNNER_TEMP/repair_core.py"
      - name: Set up laboratory runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reproduce failures using repository-approved test adapter
        id: current
        run: |
          echo "tested_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python3 "$RUNNER_TEMP/repair_core.py" run-tests \
            --policy "$RUNNER_TEMP/repair-policy.json" --repo . \
            --output "$RUNNER_TEMP/current-tests.json" --log "$RUNNER_TEMP/current-tests.txt"
          cat "$RUNNER_TEMP/current-tests.txt"
          python3 - <<'PY'
          import json,os
          data=json.load(open(os.environ['RUNNER_TEMP']+'/current-tests.json'))
          if not data['failures']:
              raise SystemExit('No currently failing test case; repair is unnecessary')
          PY

  dispatch:
    name: Dispatch only independently verified implementation defects
    needs: verify
    if: needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Authenticate latest triage on the same SHA and approved scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TESTED_SHA: ${{ needs.verify.outputs.tested_sha }}
        run: |
          python3 - <<'PY'
          import json,os,re,subprocess,sys
          from pathlib import Path
          repo,no=os.environ['GITHUB_REPOSITORY'],int(os.environ['PR_NUMBER'])
          def api(path):
              return json.loads(subprocess.check_output(['gh','api',path],text=True))
          pr=api(f'repos/{repo}/pulls/{no}')
          sha=os.environ['TESTED_SHA']
          if pr['head']['sha']!=sha or not pr['draft'] or pr['state']!='open' or pr['head']['repo']['full_name']!=repo:
              sys.exit('PR changed or is not eligible')
          labels={x['name'] for x in pr.get('labels',[])}
          if 'stage:fix' not in labels or 'stage:fix-tests' in labels:
              sys.exit('Conflicting repair routing labels')
          refs=set(re.findall(r'(?im)\b(?:closes|fixes|resolves)\s+#(\d+)\b',pr.get('body') or ''))
          if len(refs)!=1: sys.exit('PR must reference one approved Issue')
          issue=api(f'repos/{repo}/issues/{next(iter(refs))}')
          if 'stage:implementing' not in {x['name'] for x in issue['labels']}:
              sys.exit('Linked Issue is not implementing')
          plans=api(f'repos/{repo}/issues/{issue["number"]}/comments?per_page=100')
          plans=[c for c in plans if (c.get('user') or {}).get('login')=='github-actions[bot]' and '<!-- automated-planning-v1 -->' in (c.get('body') or '')]
          if not plans or not re.search(r'(?m)^\s*\*\*READY_FOR_APPROVAL\*\*\s*$',max(plans,key=lambda c:c['id'])['body']):
              sys.exit('Missing approved plan')
          comments=api(f'repos/{repo}/issues/{no}/comments?per_page=100')
          if len(comments)==100: sys.exit('Too many comments: human audit required')
          reports=[c for c in comments if (c.get('user') or {}).get('login')=='github-actions[bot]' and '<!-- defect-triage-v2\n' in (c.get('body') or '')]
          if not reports: sys.exit('Missing authenticated per-failure triage report')
          match=re.search(r'<!-- defect-triage-v2\n(.*?)\n-->',max(reports,key=lambda c:c['id'])['body'],re.S)
          if not match: sys.exit('Malformed triage report')
          d=json.loads(match.group(1))
          if d['sha']!=sha or d['route']!='IMPLEMENTATION_REPAIR':
              sys.exit('Triage does not authorize an implementation repair for current HEAD')
          defects=[f for f in d['failures'] if f['classification']=='IMPLEMENTATION_DEFECT' and f['confidence']=='HIGH']
          if not defects: sys.exit('No confirmed implementation defects')
          attempts=[c for c in comments if '<!-- controlled-repair-v2 -->' in (c.get('body') or '')]
          # Budget is a project policy, never a specific task or test name.
          # Repository policy is fetched as JSON from protected main.
          content=api(f'repos/{repo}/contents/.github/repair-policy.json?ref=main')
          import base64
          policy=json.loads(base64.b64decode(content['content']).decode('utf-8'))
          if len(attempts)>=policy['max_repair_attempts']:
              sys.exit('Implementation repair budget reached; human intervention required')
          if any('**Assessed revision:** `'+sha+'`' in (c.get('body') or '') for c in attempts):
              sys.exit('Repair already requested for this exact SHA; no duplicate dispatch')
          plan=max(plans,key=lambda c:c['id'])['body']
          summary=json.dumps(defects,ensure_ascii=False,indent=2)
          message=('@copilot\n\n<!-- controlled-repair-v2 -->\n'
                   '**Assessed revision:** `'+sha+'`\n\n'
                   'Continue on THIS Pull Request. The independent Defect Triage classified the following '
                   'specific failures as implementation defects, using the approved Issue and plan.\n\n'
                   '## Confirmed failures\n```json\n'+summary+'\n```\n\n'
                   '## Required procedure\n'
                   '1. Re-check every diagnosis against the linked Issue, approved plan, current test failures and the actual code.\n'
                   '2. Repair genuine implementation defects only, in the approved implementation scope. Do not change '
                   'independent tests, expected behavior, or unrelated features. If the diagnosis is wrong, explain and stop.\n'
                   '3. No changes to repository governance or approved specifications. Ask for human approval for new '
                   'dependencies or design changes. Preserve the test oracles.\n'
                   '4. Use the approved project test command/policy in `.github/repair-policy.json`, '
                   'report actual verification outcomes, and push fixes only to the EXISTING PR branch. Never merge.\n'
                   '5. After the new commit, the pipeline will retest and reclassify all remaining failures.\n\n'
                   'Approved implementation file patterns: '+', '.join(policy['implementation_edit_globs'])+'\n'
                   'Protected paths: '+', '.join(policy['protected_globs'])+'\n'
                   'Independent test patterns (never modify): '+', '.join(policy['test_file_globs'])+'\n'
                   f'Controlled implementation repair attempt: {len(attempts)+1} of {policy["max_repair_attempts"]}.\n')
          if len(message)>28000: sys.exit('Repair instructions too large')
          Path('implementation-repair-comment.md').write_text(message)
          print('Authorized',len(defects),'implementation defects on',sha)
          PY
      - name: Request a scoped repair from Copilot on the existing PR
        env:
          GH_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          test -n "$GH_TOKEN" || { echo 'Missing COPILOT_ASSIGN_TOKEN'; exit 1; }
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file implementation-repair-comment.md
