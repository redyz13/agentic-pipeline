name: Controlled Copilot repair

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: repair-request-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Validate failure and request repair
    if: >-
      github.event.label.name == 'stage:fix' &&
      github.event.sender.login == github.repository_owner &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify latest tester failure and implementation authorization
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          repo = os.environ['REPOSITORY']
          number = int(os.environ['PR_NUMBER'])

          def gh_json(endpoint):
              return json.loads(subprocess.check_output(
                  ['gh', 'api', endpoint], text=True))

          pr = gh_json(f'repos/{repo}/pulls/{number}')
          if not pr.get('draft') or pr.get('base', {}).get('ref') != 'main':
              sys.exit('Repair is limited to a Draft PR targeting main')
          body = pr.get('body') or ''
          refs = re.findall(r'(?im)\b(?:closes|fixes|resolves)\s+#(\d+)\b', body)
          if len(set(refs)) != 1:
              sys.exit('PR must reference exactly one issue using Closes/Fixes/Resolves #N')
          issue_number = int(refs[0])
          issue = gh_json(f'repos/{repo}/issues/{issue_number}')
          issue_labels = {label['name'] for label in issue.get('labels', [])}
          if 'stage:implementing' not in issue_labels:
              sys.exit('Linked issue is not in implementation stage')

          issue_comments = gh_json(f'repos/{repo}/issues/{issue_number}/comments?per_page=100')
          if len(issue_comments) == 100:
              sys.exit('Too many issue comments: inspect authorization manually')
          plans = [c for c in issue_comments
                   if '<!-- automated-planning-v1 -->' in (c.get('body') or '')
                   and (c.get('user') or {}).get('login') == 'github-actions[bot]']
          if not plans or not re.search(
              r'(?m)^\s*\*\*READY_FOR_APPROVAL\*\*\s*$', plans[-1]['body']
          ):
              sys.exit('Latest plan is not READY_FOR_APPROVAL')

          comments = gh_json(f'repos/{repo}/issues/{number}/comments?per_page=100')
          if len(comments) == 100:
              sys.exit('Too many PR comments: inspect manually')
          reports = [c for c in comments
                     if '<!-- independent-testing-v1 -->' in (c.get('body') or '')]
          if not reports:
              sys.exit('No independent tester report on this PR')
          latest_report = reports[-1]
          latest = latest_report['body']
          # Prevent acting on a failure report that predates the current head commit.
          head_sha = pr['head']['sha']
          commit = gh_json(f'repos/{repo}/commits/{head_sha}')
          commit_date = commit['commit']['committer']['date']
          if commit_date > latest_report['created_at']:
              sys.exit('Tester report is stale: rerun independent testing on the current PR head')
          if not re.search(r'(?m)^## Independent tester\s+.{0,10}FAIL\b', latest):
              sys.exit('Latest independent tester report is not FAIL')

          repair_count = sum('<!-- controlled-repair-v1 -->' in (c.get('body') or '')
                             for c in comments)
          if repair_count >= 2:
              sys.exit('Repair limit reached (2). Human intervention required')

          message = (
              '@copilot\n\n'
              '<!-- controlled-repair-v1 -->\n'
              'Please continue working on **this pull request**, based on the latest '
              'independent tester FAIL report, the linked Issue, its approved plan, and '
              '`docs/architecture/lab-architecture.md`.\n\n'
              '**Required procedure:**\n'
              '1. Inspect each failing assertion and trace it to an explicit approved requirement.\n'
              '2. Correct only demonstrated defects in application code; preserve the original scope.\n'
              '3. If a test asserts unsupported behavior or conflicts with the architecture, '
              'do NOT change production behavior just to satisfy it. Explain that conflict '
              'in a PR comment and request a human decision. Do not change independent tests.\n'
              '4. Do not modify `.github/`, `AGENTS.md`, `docs/architecture/`, or '
              '`tests/independent-acceptance.test.js`. Do not introduce dependencies.\n'
              '5. Run `npm test`, provide the actual outcome, and push fixes to the '
              'existing PR branch. Never merge the PR.\n\n'
              f'Controlled repair attempt: {repair_count + 1} of 2.\n'
          )
          Path('repair-comment.md').write_text(message, encoding='utf-8')
          print(f'Validated Issue #{issue_number}; tester FAIL; repair attempt {repair_count + 1}/2')
          PY

      - name: Ask Copilot to correct the existing PR
        env:
          GH_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          test -n "$GH_TOKEN" || { echo 'Missing COPILOT_ASSIGN_TOKEN'; exit 1; }
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file repair-comment.md
